name: Build and Push Docker Image (latest)

env:
  VITE_VERCEL_ENV: production

# Runs after the ci workflow passes on a push to the default branch, rather than
# repeating its lint, tests, typecheck and build here: the image build compiles
# the app anyway, and ci is what decides whether this commit is fit to publish.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches:
      - chore/all-my-stuffs

concurrency:
  # One publish at a time, newest wins: without this, an older run that finishes
  # last would overwrite the tags with an older commit. ci cancels its own
  # superseded runs, so these runs arrive in commit order and cancelling the
  # older one always leaves the newest commit published.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    # Only a successful ci run for a push; a pull request's run must never publish.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        language: ['', 'en']
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: sharevb/it-tools
          labels: |
            org.opencontainers.image.version=${{ case(matrix.language != '', format('latest-{0}', matrix.language), 'latest') }}

      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit ci tested, not whatever the branch points at by now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            "BASE_URL=/"
            "VITE_AVAILABLE_LOCALES=${{ matrix.language }}"
            "VITE_LANGUAGE=${{ matrix.language }}"
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            sharevb/it-tools:${{ case(matrix.language != '', format('latest-{0}', matrix.language), 'latest') }}
            ghcr.io/sharevb/it-tools:${{ case(matrix.language != '', format('latest-{0}', matrix.language), 'latest') }}

      # Optionally log out
      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io